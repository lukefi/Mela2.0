[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lukefi.mela2"
description = "Mela2.0 forestry simulator."
version = "0.8.5"
readme = "README.md"
requires-python = "~=3.13"
authors = [
    { name = "Daniel Melander", email = "daniel.melander@luke.fi" },
    { name = "Reetta Lempinen", email = "reetta.lempinen@luke.fi" },
    { name = "Tapio Lempinen", email = "tapio.lempinen@luke.fi" },
    { name = "Arto Haara", email = "arto.haara@luke.fi" },
    { name = "Juho-Petteri Yliuntinen" },
    { name = "Laura Jaakkola" },
    { name = "Urho Niemelä" },
    { name = "Ari-Antti Tervonen" },
    { name = "Tapani Stylman" }
]
dependencies = [
    "geopandas == 1.1.3",
    "shapely == 2.1.2",
    "pandas == 3.0.3",
    "rpy2==3.6.7",
    "numba==0.65.1",
    "scipy==1.17.1",
    "cffi==2.0.0",
    "numpy==2.4.5"
]

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-cov",
    "parameterized==0.9.0",
    "robotframework==7.4.2",
    "pylint==4.0.5",
    "mypy==2.1.0",
    "pandas-stubs~=3.0.3",
    "types-shapely~=2.1.2",
    "types-geopandas~=1.1.3",
    "types-cffi~=2.0.0",
]

[project.scripts]
mela2 = "lukefi.metsi.app.metsi:main"

[tool.setuptools.package-dir]
lukefi = "lukefi"
examples = "examples"

[tool.setuptools.package-data]
"lukefi.metsi.forestry.lua" = ["*"]
"lukefi.metsi.forestry.r" = ["*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning:.*metsi.tests.app.file_io_test",
]
